<!doctype html><html><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>PocketSmart AI</title>
<style>
body{font-family:system-ui,sans-serif;margin:0;background:#f4f6fb;color:#222}
nav{background:#3b2f8f;color:#fff;padding:12px 20px;display:flex;gap:16px;flex-wrap:wrap;align-items:center}
nav a{color:#fff;text-decoration:none}nav b{margin-right:auto;font-size:1.2em}
main{max-width:900px;margin:24px auto;padding:0 16px}
.card{background:#fff;border-radius:12px;padding:16px;margin:12px 0;box-shadow:0 1px 4px #0002}
.grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(240px,1fr));gap:12px}
input,button{width:100%;padding:10px;margin:6px 0 12px;border:1px solid #ccc;border-radius:8px;box-sizing:border-box}
button,.btn{background:#3b2f8f;color:#fff;border:0;cursor:pointer;text-decoration:none;display:inline-block;padding:10px 14px;border-radius:8px}
.err{color:#c00}
</style></head><body>
<nav><b>💰 PocketSmart AI</b><a href="/">Home</a>
{% if user %}<a href="/dashboard">Dashboard</a><a href="/history">History</a><a href="/logout">Logout ({{ user }})</a>
{% else %}<a href="/login">Login</a><a href="/register">Register</a>{% endif %}</nav>
<main>{% block content %}{% endblock %}</main></body></html>
